[package]
name = "er-cu-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
# Inherit workspace dependency pins to avoid a divergent version graph.
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-client.workspace = true
solana-sdk.workspace = true
solana-program.workspace = true
# Not in the workspace table — pin locally, matched to the solana-* versions above.
solana-transaction-status = { workspace = true }
solana-system-interface = { version = "3", features = ["bincode"] }
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
sha2 = "0.10"
# Engine revision is pinned to match the workspace dependency.
nimzovich_engine = { git = "https://github.com/trilltino/xfchess-contracts.git", rev = "67932ae105b67d58b78cd2203c9657204bf8b259", package = "nimzovich_engine" }
ephemeral-rollups-sdk = { workspace = true }
# Async HTTP for the raw-JSON-RPC load test (precise 429 detection + concurrency).
reqwest.workspace = true
# StreamExt for the WebSocket pubsub stream probe (pure Rust, no toolchain).
tokio-stream = "0.1"

# The optional geyser feature isolates gRPC dependencies from the default benchmark suite.
yellowstone-grpc-client = { version = "6.1.0", optional = true }
yellowstone-grpc-proto = { version = "6.1.0", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
geyser = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto", "dep:futures"]

[[bin]]
name = "triton-bench"
path = "src/bin/triton_bench.rs"
