[package]
name = "xfchess-client-compat"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
solana-sdk.workspace = true
solana-rpc-client = "=4.3.2"
solana-rpc-client-api = "=4.3.2"
solana-commitment-config = "=3.1.1"
solana-transaction-status-client-types = "=4.3.2"
# Enable the current codec on SDK 5's transaction type. Agave 4.3's public decoder
# consumes the same wire format and supplies its own required Rust transaction type.
solana-transaction = { version = "=5.1.0", features = ["wincode"] }
wincode = "=0.6.3"

[lints]
workspace = true
