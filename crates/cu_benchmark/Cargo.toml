[package]
name = "cu_benchmark"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false
default-run = "cu_benchmark"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
solana-client.workspace = true
solana-sdk.workspace = true
solana-program.workspace = true
solana-transaction-status = { workspace = true }
solana-system-interface = { version = "3", features = ["bincode"] }
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
sha2 = "0.10"
nimzovich_engine.workspace = true
swiss-pairing = { path = "../shared/swiss-pairing" }
ephemeral-rollups-sdk = { workspace = true }
reqwest.workspace = true
url.workspace = true
tokio-stream = "0.1"

yellowstone-grpc-client = { version = "6.1.0", optional = true }
yellowstone-grpc-proto = { version = "6.1.0", optional = true }
futures = "0.3"

[features]
default = []
geyser = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto"]

[dev-dependencies]
axum.workspace = true
tempfile = "3.8"

[[bin]]
name = "triton-bench"
path = "src/bin/triton_bench.rs"

[[bin]]
name = "cu_benchmark"
path = "src/main.rs"

[[bin]]
name = "inspect"
path = "src/bin/inspect.rs"
