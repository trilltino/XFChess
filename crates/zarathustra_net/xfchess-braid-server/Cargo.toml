[package]
name = "xfchess-braid-server"
version.workspace = true
edition.workspace = true
description = "Braid-HTTP 209 subscribe server for XFChess tournament state streaming"
license.workspace = true

[dependencies]
# The wire format lives in braid-http, shared with the client's parser, so the
# server can never drift from what the client can read.
braid-http  = { workspace = true }
axum        = { workspace = true, features = [] }
tower-http  = { workspace = true, features = ["cors"] }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
json-patch  = "2"
bytes       = { version = "1", features = ["serde"] }
async-stream = "0.3"
parking_lot = { workspace = true }
futures     = { workspace = true }
tracing     = { workspace = true }

tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio       = { workspace = true }
axum-test   = "20"
