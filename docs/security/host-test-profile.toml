# Explicitly selected host-only verification profile. The application defaults
# optimize every dependency for Bevy; Solana harness builds do not need that.
# This file does not override release/SBF settings or change dependency versions.
[profile.dev]
opt-level = 0
debug = 0

[profile.dev.package."*"]
opt-level = 0

[profile.dev.build-override]
opt-level = 0

[profile.test]
opt-level = 0
debug = 0

[profile.test.package."*"]
opt-level = 0

[profile.test.build-override]
opt-level = 0
