[package]
name = "braid-iroh"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
proxy = ["dep:axum", "dep:tower", "dep:async-stream", "dep:iroh-h3-axum", "dep:iroh-h3-client"]

[dependencies]
async-stream = { version = "0.3", optional = true }
iroh.workspace = true
n0-future = "0.3.2"
iroh-gossip = { workspace = true, features = ["net"] }

braid-http = { path = "../braid-http" }

axum = { workspace = true, optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
iroh-h3-axum = { path = "../iroh-h3-axum", optional = true }
iroh-h3-client = { path = "../iroh-h3-client", optional = true }
http = "1"
parking_lot.workspace = true

tokio = { workspace = true }
futures = { workspace = true }

serde_json = { workspace = true }
bytes = "1"

blake3 = "1"

tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anyhow.workspace = true
braid_chess = { path = "../braid_chess" }
tempfile = "3"

[lints]
workspace = true
