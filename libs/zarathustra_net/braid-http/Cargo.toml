[package]
name = "braid-http"
version = "0.1.0"
edition = "2021"
description = "Braid-HTTP wire codec, client and reliable channel (imported from braid-reborn; see libs/zarathustra_net/UPSTREAM.md)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
async-channel = "2.3"
uuid = { workspace = true, features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
tracing = { workspace = true }
url = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
futures = { workspace = true }
http = "1"
httpdate = "1"
sfv = "0.14"
sha2 = "0.10"
arbitrary = { version = "1.4", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["json", "stream", "multipart", "http2"] }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
getrandom = { version = "0.2", features = ["js"] }
tokio = { version = "1", features = ["sync", "macros"] }

[features]
default = ["native"]
native = []
wasm = ["dep:gloo-timers", "dep:wasm-bindgen-futures", "dep:wasm-bindgen", "dep:js-sys"]
fuzzing = ["dep:arbitrary"]
# Deterministic persistence fault plans for tests; inert unless a plan is armed.
fault-injection = []

[dev-dependencies]
anyhow.workspace = true
async-stream = "0.3"
axum = { workspace = true, features = ["http2"] }
tower-http = { workspace = true, features = ["cors"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
