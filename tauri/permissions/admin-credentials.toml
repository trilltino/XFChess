# The admin API key is kept in the OS credential store by Rust. Only the
# tournament-admin window may read, save or clear it (capabilities/admin-credentials.json).

[[permission]]
identifier = "allow-admin-credentials"
description = "Allows the tournament-admin window to load, save and clear its per-environment admin API key in the OS credential store."
commands.allow = ["admin_token_load", "admin_token_save", "admin_token_clear"]
