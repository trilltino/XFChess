services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: xfchess-prometheus-local
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus-data-local:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    restart: unless-stopped
    networks:
    - monitoring-local
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    security_opt:
    - no-new-privileges:true
    extra_hosts:
    - host.docker.internal:host-gateway
  grafana:
    image: grafana/grafana:13.2.3
    container_name: xfchess-grafana-local
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - ./grafana/datasources-local:/etc/grafana/provisioning/datasources:ro
    - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    - grafana-data-local:/var/lib/grafana
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_PLUGINS_PREINSTALL_DISABLED=true
    - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    - GF_SERVER_ROOT_URL=http://localhost:3000
    restart: unless-stopped
    networks:
    - monitoring-local
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    security_opt:
    - no-new-privileges:true
volumes:
  prometheus-data-local:
    driver: local
  grafana-data-local:
    driver: local
networks:
  monitoring-local:
    driver: bridge
