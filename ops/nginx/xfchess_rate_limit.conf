# Include these zones in nginx http context. Signing limits allow multiple
# players behind one NAT to create and activate sessions without exhausting the burst.
limit_req_zone $binary_remote_addr zone=signing:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=moves:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=mail:10m    rate=3r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=120r/m;
