# Rate-limiting zones for XFChess — included in nginx http context
# Deploy: upload to /etc/nginx/conf.d/xfchess_rate_limit.conf
#
# signing: 30 req/min per IP for /session/* (Solana session tx signing)
# moves:   60 req/min per IP for /move/*    (chess moves)
# auth:    10 req/min per IP for /api/auth/* (login/register — brute force guard)
# mail:     3 req/min per IP for signup (email/disk abuse guard)
# api:    120 req/min per IP general /api/* fallback
#
# signing was 10r/m — IP-based, so two real players behind one NAT (same
# household/office wifi, not just two dev instances on one machine) share
# this one bucket. A normal session setup (create + activate + a couple of
# sign calls each) burns through 5-6 requests per player fast; two players
# racing to set up a game against each other blew through the old burst=5
# limit and got nginx's default HTML 503 back instead of JSON — which the
# client then failed to parse as a session response, surfacing as a
# confusing "parse: error decoding response body" instead of a rate-limit
# message.
limit_req_zone $binary_remote_addr zone=signing:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=moves:10m   rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=mail:10m    rate=3r/m;
limit_req_zone $binary_remote_addr zone=api:10m     rate=120r/m;
