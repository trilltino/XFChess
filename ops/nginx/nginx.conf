# XFChess nginx configuration
# Rate-limit zones are declared in /etc/nginx/conf.d/xfchess_rate_limit.conf
# (uploaded by deploy.ps1 to the http context)
#
# SSL certificates: managed by certbot (`certbot --nginx -d YOUR_DOMAIN`)
# For IP-only deployments, deploy.ps1 generates a self-signed cert at
#   /etc/ssl/xfchess/selfsigned.{crt,key}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Allow certbot ACME challenges through before redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # TLS hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Security headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    # CSP in report-only first — wallet SDKs inject scripts + open RPC/WS conns.
    # Watch console reports, then switch to enforcing (drop "-Report-Only").
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'" always;
    client_max_body_size 1m;

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    root /opt/xfchess/web;
    index index.html;

    # Vite prerenders each route to its own directory (dist/home/index.html,
    # not a flat home.html). `try_files $uri $uri/ ...` resolves a bare
    # `/home` request by matching the *directory* `/home/`, and nginx always
    # 301-redirects a directory match to add the trailing slash before
    # serving it — but the page's own canonical tag says `/home` (no slash)
    # is canonical, so the canonical target just bounces back to the page
    # claiming it. Checking for the nested index.html directly serves the
    # bare path with no redirect, matching the canonical tag exactly.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # ── Admin API is NEVER served publicly ────────────────────────────────────
    # Operators reach /admin/* via an SSH tunnel straight to 127.0.0.1:8090
    # (ssh -L 8091:127.0.0.1:8090). 444 closes the connection with no response,
    # so this must sit above `location /` to beat the SPA try_files fallback.
    location /admin/ {
        return 444;
    }

    # ── Email endpoints — tight rate limit (abuse/disk guard) ─────────────────
    location = /api/signup {
        limit_req zone=mail burst=2 nodelay;
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Auth endpoints — brute-force guard ────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend API (reverse proxy to Axum on port 8090) ─────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Game session signing (native client → /session/sign) — rate limited ───
    # burst bumped from 5 alongside the zone's rate (10r/m -> 30r/m) — see
    # xfchess_rate_limit.conf for why.
    location /session/ {
        limit_req zone=signing burst=15 nodelay;
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Game move recording (native client → /move/record) — rate limited ─────
    location /move/ {
        limit_req zone=moves burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Game session create / finalize / status ───────────────────────────────
    location /game/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Casual P2P lobby relay (JOIN_ACK handshake before a game_id exists) ────
    location /p2p/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Remaining bare-root backend routes ─────────────────────────────────────
    # None of these collide with a frontend page (unlike /tournaments — see the
    # /api/tournaments alias instead), they were just never given a location
    # block at all, so they fell through to the SPA catch-all and silently
    # 200-ed with HTML instead of reaching the backend. Found via an exhaustive
    # audit of every route the backend registers outside /api/ — see backend
    # commit history around 2026-08-11 for how this was missed piecemeal at
    # first (only /p2p/ and /tournaments were caught before this pass).
    # No trailing slash: the list endpoint is bare GET /friends (no sub-path),
    # and a location requiring a trailing slash doesn't match a bare path —
    # confirmed live (301 instead of proxying) before this fix.
    location /friends {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /presence {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /games/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /ratings/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /puzzle/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /matchmaking/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /dispute/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /relayer/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /identity/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /telemetry/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /player/ {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /stats {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health / readiness (deploy verify + uptime monitors) ──────────────────
    location = /health {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
    }
    location = /readyz {
        proxy_pass         http://127.0.0.1:8090;
        proxy_set_header   Host $host;
    }

    location /ws {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
