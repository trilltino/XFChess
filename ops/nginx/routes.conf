# Shared by HTTP, HTTPS and staging. Keep private APIs out of the SPA fallback.
location ~ ^/(admin|metrics)(/|$) { return 444; }

location = /api/signup {
    limit_req zone=mail burst=2 nodelay;
    include /etc/nginx/snippets/xfchess-proxy.conf;
}
location ~ ^/(api/auth|auth)(/|$) {
    limit_req zone=auth burst=5 nodelay;
    include /etc/nginx/snippets/xfchess-proxy.conf;
}
location /session/ {
    limit_req zone=signing burst=5 nodelay;
    include /etc/nginx/snippets/xfchess-proxy.conf;
}
location /move/ {
    limit_req zone=moves burst=20 nodelay;
    include /etc/nginx/snippets/xfchess-proxy.conf;
}
# Braid and SSE need immediate delivery; disabling buffering also covers tournament feeds.
location ~ ^/(game|api)(/|$) {
    limit_req zone=api burst=20 nodelay;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    include /etc/nginx/snippets/xfchess-proxy.conf;
}
location ~ ^/(p2p|friends|presence|games|ratings|puzzle|matchmaking|dispute|relayer|identity|telemetry|player|stats|health|readyz|ws|offline-tournaments)(/|$) {
    limit_req zone=api burst=20 nodelay;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    include /etc/nginx/snippets/xfchess-proxy.conf;
}
location / { try_files $uri $uri/index.html /index.html; }
location ~ /\. { deny all; }
