# Prometheus configuration for XFChess monitoring
# Scrapes metrics from the backend application.
#
# All targets are plain localhost — this container runs with
# `network_mode: host` (see docker-compose.yml's comment for why: the
# bridge-network + host.docker.internal approach silently doesn't route
# across custom Docker networks), so "localhost" here really is the host.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # XFChess backend — native systemd process on the host, port 8090.
  - job_name: "xfchess-backend"
    static_configs:
      - targets: ["localhost:8090"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # node_exporter — native systemd install on the host, bound to
  # 127.0.0.1:9100 (see ops/scripts/deploy.ps1 Step 2d).
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
