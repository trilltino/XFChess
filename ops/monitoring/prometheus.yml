# Targets use host loopback because this container uses host networking.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # XFChess backend — native systemd process on the host, port 8090.
  - job_name: "xfchess-backend"
    static_configs:
      - targets: ["localhost:8090"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # node_exporter listens on host loopback port 9100.
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
