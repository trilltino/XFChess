# AlertManager configuration for XFChess
# Routes alerts to a Telegram bot. The bot token is never committed — it's
# mounted from a secrets file (see docker-compose.yml's alertmanager volume)
# that setup.sh creates on the server from ops/monitoring/.env, which you
# fill in once. chat_id is substituted by setup.sh from the same .env (it's
# not a secret, but Alertmanager has no env-var interpolation of its own, so
# it can't read it directly — see setup.sh's sed step).

global: {}

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram'
  routes:
    # Critical alerts page immediately with no batching wait.
    - match:
        severity: critical
      receiver: 'telegram'
      group_wait: 0s
      continue: false

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: __TELEGRAM_CHAT_ID__
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        message: |
          {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} <b>{{ .CommonLabels.alertname }}</b> ({{ .CommonLabels.severity }})
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  # If a critical alert is firing, suppress warning for same alert
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
