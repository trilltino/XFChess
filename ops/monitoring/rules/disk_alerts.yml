groups:
- name: xfchess_disk
  rules:
  - alert: DiskUsageHigh
    expr: 1 - node_filesystem_avail_bytes{job="node",mountpoint=~"/|/opt/xfchess",fstype!~"tmpfs|overlay|squashfs"}
      / node_filesystem_size_bytes{job="node",mountpoint=~"/|/opt/xfchess",fstype!~"tmpfs|overlay|squashfs"}
      > 0.80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'Filesystem usage is high: {{ $labels.mountpoint }}'
      description: '{{ $value | humanizePercentage }} used on {{ $labels.instance
        }}. Database writes need free disk space.'
  - alert: DiskUsageCritical
    expr: 1 - node_filesystem_avail_bytes{job="node",mountpoint=~"/|/opt/xfchess",fstype!~"tmpfs|overlay|squashfs"}
      / node_filesystem_size_bytes{job="node",mountpoint=~"/|/opt/xfchess",fstype!~"tmpfs|overlay|squashfs"}
      > 0.95
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: 'Filesystem usage is high: {{ $labels.mountpoint }}'
      description: '{{ $value | humanizePercentage }} used on {{ $labels.instance
        }}. Database writes need free disk space.'
