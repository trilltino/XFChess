# Staging listens on port 8091; configure its certificate separately.

server {
    listen 443 ssl;
    server_name staging.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/staging.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Optional: keep search engines off staging.
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 1m;

    root /opt/xfchess-staging/web;
    index index.html;

    set $xfchess_backend http://127.0.0.1:8091;
    include /etc/nginx/snippets/xfchess-routes.conf;
}
