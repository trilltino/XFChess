<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Bump the query version when changing the favicon; browsers cache it across hard refreshes. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SeoHead supplies per-route metadata. Keep defaults out of this template
    because React does not deduplicate raw meta/link tags against hoisted tags. -->
    <title>XFChess | Competitive Chess Server</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
