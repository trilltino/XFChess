name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Rust source extraction policy
        run: pwsh -NoProfile -File scripts/check_rust_safety.ps1 -InventoryOnly
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Check
        run: |
          cargo check -p xfchess --all-targets
          cargo check -p xfchess --all-targets --features solana
          cargo check -p backend --all-targets
          cargo check -p xfchess-game
      - name: Verify application engine dependency boundary
        run: pwsh -NoProfile -File scripts/check_engine_dependencies.ps1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: tauri-apps-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: tauri-wallet-ui-dist
          path: tauri/wallet-ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-tournament-admin-dist
          path: tauri/tournament-admin/dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-viz-dist
          path: tauri/viz/dist
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy
        run: |
          cargo clippy -p xfchess --all-targets --features solana -- -D warnings
          cargo clippy -p backend -p xfchess-rules -p xfchess-stockfish --all-targets -- -D warnings
          cargo clippy -p xfchess-game -- -D warnings
          cargo clippy -p xfchess-game --tests -- -D warnings
      - name: Enforce Rust safety policy
        run: pwsh -NoProfile -File scripts/check_rust_safety.ps1

  rust-safety-windows:
    name: Windows native Rust safety
    needs: tauri-apps-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Expose bundled LLVM linker
        shell: pwsh
        run: |
          $rustRoot = rustc --print sysroot
          "$rustRoot/lib/rustlib/x86_64-pc-windows-msvc/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: tauri-wallet-ui-dist
          path: tauri/wallet-ui/dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-tournament-admin-dist
          path: tauri/tournament-admin/dist
      - uses: actions/download-artifact@v4
        with:
          name: tauri-viz-dist
          path: tauri/viz/dist
      - name: Check desktop and wallet platform paths
        run: pwsh -NoProfile -File scripts/check_rust_safety.ps1 -PlatformOnly
      - name: Test native wallet and benchmark safeguards
        run: |
          cargo test --locked -p xfchess-tauri --features production,wallet,tournament-admin
          cargo test --locked -p xfchess-viz

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev libssl-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # Match the latest stable runtime/test cohort and pin the SBF compiler.
      - name: Install Solana CLI (cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install cargo-build-sbf --version 4.5.0 --locked --force
      # Program-test suites load target/deploy/xfchess_game.so; build it before cargo test.
      - name: Build on-chain program (.so for solana-program-test)
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          export NO_DNA=1
          cargo build-sbf --arch v0 --tools-version v1.58 --manifest-path programs/xfchess-game-sbf/Cargo.toml -- --locked
      - name: Application and engine tests (isolated from contract features)
        run: cargo test -p xfchess -p backend -p xfchess-rules -p xfchess-stockfish
      - name: Record the built program hash
        run: sha256sum target/deploy/xfchess_game.so && wc -c target/deploy/xfchess_game.so
      - name: Fetch pinned external tournament-pass fixture
        run: python3 docs/security/fetch_pass_fixture.py
      # Rollback recipient tests run the real MagicBlock Delegation Program binary.
      - name: Fetch pinned Delegation Program fixture
        run: python3 docs/security/fetch_dlp_fixture.py
      - name: Contract tests, including host-rules compatibility
        run: cargo test -p xfchess-game -- --test-threads=1
      - name: Remaining workspace tests
        run: cargo test --workspace --exclude xfchess --exclude backend --exclude xfchess-game --exclude xfchess-rules --exclude xfchess-stockfish
      # The default build leaves out braid-iroh's H3 interface, so its access-policy,
      # revocation and bridge tests only run with the feature on.
      - name: Iroh H3 interface tests
        run: cargo test --locked -p braid-iroh --features proxy

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown -p xfchess
        continue-on-error: true

  # RustSec is advisory until findings without upstream fixes are triaged.
  cargo-audit:
    name: Security Audit (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
        continue-on-error: true

  # Run the separate desktop UI unit suites; these do not exercise the native Tauri shell.
  tauri-apps-test:
    name: Tauri Apps (tests and build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [tournament-admin, wallet-ui, viz]
    defaults:
      run:
        working-directory: tauri/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.app }}-dist
          path: tauri/${{ matrix.app }}/dist
          if-no-files-found: error

  # Web frontend: build gate + dependency audit (npm). Build is a hard gate; audit
  # is informative until triaged.
  web-ci:
    name: Web (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xfchessdotcom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests (builds + serves dist/ itself)
        run: npm run test:e2e
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
