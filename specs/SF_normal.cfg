\* Nonce and parent_nonce checks must keep the committed chain linearizable
\* under Byzantine submissions and mempool reordering.
SPECIFICATION Spec

CONSTANTS
    Agents      = {A, B}
    Outsiders   = {}
    Authorized  = {A, B}
    MaxNonce    = 3
    MaxContent  = 2
    Byzantine   = {A}
    SubmitCap   = 5
    EnforceNonce = TRUE
    EnforceAuth  = TRUE

INVARIANT TypeOK
INVARIANT ChainLinearizable
INVARIANT OnlyAuthorizedCommitted
