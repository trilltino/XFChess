\* Combine equivocation and impersonation with GenesisBypass disabled and AuthBinding enabled.
\* All safety invariants must hold.
SPECIFICATION SafeSpec

CONSTANTS
    Agents      = {A, B}
    MaxSeq      = 2
    MaxContent  = 2
    Byzantine   = {A}
    CheckParent   = TRUE
    GenesisBypass = FALSE
    AuthBinding   = TRUE
    EnableAdversary = TRUE

CONSTRAINT NetBounded

INVARIANT TypeOK
INVARIANT NoFork
INVARIANT SeqMonotonic
INVARIANT NoEquivocationAccepted
INVARIANT OnlyAuthenticAccepted
