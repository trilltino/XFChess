\* Models CausalChainState.applied_versions present: the same move,
\* delivered redundantly over both gossip and Braid, is dispatched to the
\* board at most once.
\* EXPECTED RESULT: NoDoubleApply holds.
SPECIFICATION Spec

CONSTANTS
    Agents      = {A, B}
    Outsiders   = {C}
    MaxSeq      = 3
    MaxContent  = 3
    AuthCheck   = TRUE
    DedupPresent = TRUE

INVARIANT TypeOK
INVARIANT NoDoubleApply
