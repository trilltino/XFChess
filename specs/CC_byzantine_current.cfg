\* With the genesis bypass enabled, Byzantine equivocation violates NoFork.
SPECIFICATION SafeSpec

CONSTANTS
    Agents      = {A, B}
    MaxSeq      = 2
    MaxContent  = 2
    Byzantine   = {A}
    CheckParent   = TRUE
    GenesisBypass = TRUE
    AuthBinding   = TRUE
    EnableAdversary = FALSE

INVARIANT TypeOK
INVARIANT NoFork
INVARIANT SeqMonotonic
INVARIANT NoEquivocationAccepted
INVARIANT OnlyAuthenticAccepted
