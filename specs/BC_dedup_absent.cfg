\* Models the dedup set removed entirely: the same move, delivered
\* redundantly over both gossip and Braid, would be dispatched to the board
\* twice with nothing stopping it.
\* EXPECTED RESULT: NoDoubleApply is VIOLATED (proves the set is necessary,
\* not merely convenient — mirrors CC_byzantine_broken.cfg's pattern).
SPECIFICATION Spec

CONSTANTS
    Agents      = {A, B}
    Outsiders   = {C}
    MaxSeq      = 3
    MaxContent  = 3
    AuthCheck   = TRUE
    DedupPresent = FALSE

INVARIANT TypeOK
INVARIANT NoDoubleApply
