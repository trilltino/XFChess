[package]
name = "xfchess"
version = "0.1.0"
edition = "2021"

# Build rlib for desktop linkage and cdylib for Android GameActivity loading.
[lib]
name = "xfchess"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "xfchess"
path = "src/main.rs"
test = false

[[bin]]
name = "pda"
path = "src/bin/pda.rs"
required-features = ["solana"]

[[bin]]
name = "read_game"
path = "src/bin/read_game.rs"
required-features = ["solana"]

[[bin]]
name = "tournament_test"
path = "src/bin/tournament_test.rs"
required-features = ["solana"]

[[bin]]
name = "debugger"

path = "src/bin/debugger.rs"

# Require solana for this binary; otherwise automatic discovery finds no main function.
[[bin]]
name = "profile_pda"
path = "src/bin/profile_pda.rs"
required-features = ["solana"]

[workspace]
resolver = "2"
members = [
    "crates/zarathustra_net/*",
    # crates/solana/* removed — chess-logic-on-chain consolidated into
    # programs/xfchess-game/src/chess_logic_on_chain.rs
    "crates/shared/*",
    "crates/er-cu-benchmark",
    "programs/*",
    "tauri",
    "tauri/viz/src-tauri",
    "backend",
]
exclude = []

[profile.dev]
opt-level = 1
debug = 1        # Only include line numbers, not full symbols (saves GBs of disk space)
strip = "debuginfo" # Strip debuginfo from the resulting binary (reduces .exe size)

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# Optimize build scripts and proc-macros to reduce compilation time.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3

[profile.release]
opt-level = 3
# Thin LTO: nearly the runtime perf of fat LTO but 2-4x faster to build — a big
# win for the on-VPS backend build and local release iteration.
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# Size-optimized profile for Solana program
[profile.release.package.xfchess-game]
opt-level = "z"
codegen-units = 1


[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["trilltino"]
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/trilltino/XFChess"
documentation = "https://github.com/trilltino/XFChess"
homepage = "https://github.com/trilltino/XFChess"
keywords = ["solana", "chess", "gaming"]

[workspace.dependencies]
# Anchor 1.1.2 supports the Solana 3.x account model.
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"
# Solana 3.0.0: paired with the anchor-lang 1.1.2 pin above, same migration.
solana-program = "=3.0.0"
solana-program-test = "=3.1.12"
solana-sdk = "=3.0.0"
solana-client = "=3.1.12"
solana-transaction-status = "=3.1.12"
borsh = "=1.8.0"
chrono = { version = "=0.4.44", features = ["serde"] }
serde_bytes = "=0.11.17"
clap = { version = "=4.5", features = ["derive", "env"] }
egui = "=0.34"
iroh = "=1.0.3"
iroh-base = "=1.0.3"
bevy_egui = "=0.40.1"

webbrowser = "=1.1.0"
# Require canonical undelegation-buffer PDA checks; see the MagicBlock lifecycle runbook.
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "instruction"] }
# Embed security.txt metadata for explorers and solana-verify.
solana-security-txt = "=1.1.3"
axum = "=0.8.9"
tower-http = "=0.7.0"
xfchess-game = { path = "programs/xfchess-game", version = "0.1.0" }
braid-core = { path = "crates/zarathustra_net/braid-core" }
braid-http = { path = "crates/zarathustra_net/braid-http" }
braid-iroh = { path = "crates/zarathustra_net/braid-iroh" }
braid_chess = { path = "crates/zarathustra_net/braid_chess" }
iroh-gossip = { version = "0.101.0" }
# The public contracts repo is pinned so CI and clean checkouts can resolve it.
nimzovich_engine = { git = "https://github.com/trilltino/xfchess-contracts.git", rev = "67932ae105b67d58b78cd2203c9657204bf8b259", package = "nimzovich_engine" }
xfchess-anticheat = { path = "crates/shared/xfchess-anticheat" }
# The exact Bevy pin matches release-candidate APIs used by feature-gated code;
# check those paths when upgrading.
bevy = { version = "=0.19.0", default-features = false, features = ["default", "webgl2", "mp3", "bevy_gltf", "jpeg", "hdr", "android-game-activity"] }
bevy_sprite = "=0.19.0"
bevy_text = "=0.19.0"
bevy_ui = "=0.19.0"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
# Match Bevy’s winit version so window Icon types unify.
winit = "=0.30.13"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-tungstenite = "=0.20.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
bincode = "=1.3.3"
json = { package = "sonic-rs", version = "=0.3" }
futures = "=0.3"
parking_lot = "=0.12"
url = { version = "=2.5", features = ["serde"] }
base64 = "=0.22"
zstd = "=0.13"
rand = "=0.10"
regex = "=1.12.3"
thiserror = "=2.0.18"
anyhow = "=1.0.102"
futures-lite = "=2.6.1"
async-trait = "=0.1.89"
uuid = { version = "=1.21.0", features = ["v4", "fast-rng"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tracing-appender = "=0.2.3"
reqwest = { version = "=0.13.4", features = ["json", "blocking"] }
bs58 = "=0.5.1"
crossbeam-channel = "=0.5.15"
web-time = "=1.1"

[features]
default = []
profile = ["bevy/trace_tracy"]
# FixedNode needs a newer Bevy export; keep viewport HUD anchoring opt-in
# until the pinned release supports it.
bevy_fixed_node = []
# Keep atmosphere opt-in until the pinned Bevy release supports multiple cameras.
sky = []
# Development-only unsigned gossip. Production rejects plaintext moves to require authentication.
allow-unsigned-p2p = []
# Development-only TempleOS theme; excluded from default builds.
templeos = []
solana = [
    "anchor-lang",
    "solana-sdk",
    "solana-client",
    "solana-program",
    "ephemeral-rollups-sdk",
    "solana-system-interface",
    "solana-commitment-config",
    "xfchess-game",
]

[dependencies]
bevy.workspace = true
bevy_sprite = { workspace = true }
bevy_text = { workspace = true }
bevy_ui = { workspace = true }
image = { workspace = true }
winit = { workspace = true }
tokio.workspace = true
futures-lite.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
directories = "6.0.0"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender.workspace = true
uuid.workspace = true
web-time.workspace = true
reqwest.workspace = true
anchor-lang = { workspace = true, optional = true }
nimzovich_engine = { workspace = true }
bevy_egui = { workspace = true }
solana-sdk = { workspace = true, optional = true }
solana-client = { workspace = true, optional = true }
webbrowser.workspace = true
braid_chess.workspace = true
braid-iroh = { workspace = true, features = ["proxy"] }
braid-core.workspace = true
iroh-gossip.workspace = true
sha2 = "0.10.8"
aes-gcm = "0.10.3"
dirs = "5.0.1"
chrono.workspace = true
serde_bytes.workspace = true
iroh.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
solana-program = { workspace = true, optional = true }
bs58.workspace = true
borsh.workspace = true
anyhow = { workspace = true }
clap.workspace = true
egui.workspace = true
bincode.workspace = true
zstd.workspace = true
futures = { workspace = true }
base64.workspace = true
regex.workspace = true
ed25519-dalek = "2"
ephemeral-rollups-sdk = { workspace = true, optional = true }
solana-system-interface = { version = "3", features = ["bincode"], optional = true }
solana-commitment-config = { version = "3", optional = true }
xfchess-game = { workspace = true, optional = true }

[dev-dependencies]
proptest = "1"

# Used by tauri_signer::bring_wallet_popup_to_front — same feature set and
# version as tauri/Cargo.toml's own `windows` dependency.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Match the JNI version selected by bevy_android to avoid incompatible duplicate majors.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.22.4", default-features = false }
ndk-context = "=0.1.1"
# Send tracing events to Android logcat alongside the file log subscriber.
paranoid-android = "=0.2.2"
# Use log for Android bootstrap before Bevy installs the tracing subscriber.
android_logger = "=0.15.1"
# Use a compatible log range so transitive facade constraints can resolve together.
log = "0.4"
# Declare the verifier directly for Android init_with_env; initialize its
# Context before constructing any HTTP client.
rustls-platform-verifier = "=0.7.0"

# rfd has no Android dialog backend; use the platform-gated default save path.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
