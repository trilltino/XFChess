[workspace]
resolver = "2"
members = [
    "apps/xfchess-client",
    "apps/tauri",
    "services/backend",
    "crates/xfchess-client-*",
    "crates/xfchess-platform-api",
    "crates/network/*",
    "crates/tournament/*",
    "crates/anti-cheat/*",
    "crates/chess/*",
    "crates/solana/xfchess-client-compat",
    "tools/cu_benchmark",
    "programs/*",
]
default-members = ["apps/xfchess-client"]

[profile.dev]
opt-level = 1
debug = "line-tables-only"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
strip = "debuginfo"

[profile.coverage.package."*"]
opt-level = 0

[profile.coverage.build-override]
opt-level = 0

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[profile.release.package.xfchess-game]
opt-level = "z"
codegen-units = 1

[profile.release.package.xfchess-game-sbf]
opt-level = "z"
codegen-units = 1

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["trilltino"]
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/trilltino/XFChess"
documentation = "https://github.com/trilltino/XFChess"
homepage = "https://github.com/trilltino/XFChess"
keywords = ["solana", "chess", "gaming"]

[workspace.dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["init-if-needed", "solana-v4"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions", "solana-v4"] }
solana-program = "=5.1.0"
solana-program-test = { version = "=4.3.2", features = ["agave-unstable-api"] }
solana-sdk = "=5.0.0"
solana-client = "=4.3.2"
solana-transaction-status = "=4.3.2"
xfchess-client-compat = { path = "crates/solana/xfchess-client-compat" }
borsh = "=1.8.1"
chrono = { version = "=0.4.45", features = ["serde"] }
serde_bytes = "=0.11.19"
clap = { version = "=4.5", features = ["derive", "env"] }
egui = "=0.36"
iroh = "=1.4.1"
iroh-base = "=1.4.1"
bevy_egui = "=0.43.1"
webbrowser = "=1.1.0"
ephemeral-rollups-sdk = { version = "=0.17.3", default-features = false, features = ["instruction", "solana-system-interface"] }
solana-security-txt = "=1.1.3"
axum = "=0.8.9"
tower-http = "=0.7.0"
xfchess-game = { path = "programs/xfchess-game", version = "0.1.0", default-features = false, features = ["no-entrypoint", "devnet"] }
braid-http = { path = "crates/network/braid-http" }
braid-iroh = { path = "crates/network/braid-iroh" }
braid_chess = { path = "crates/network/braid_chess" }
iroh-gossip = { version = "0.101.0" }
nimzovich_engine = { path = "crates/chess/nimzovich_engine", default-features = false, features = ["account-bytes"] }
xfchess-anticheat = { path = "crates/anti-cheat/xfchess-anticheat" }
xfchess-rules = { path = "crates/chess/xfchess-rules" }
xfchess-stockfish = { path = "crates/chess/xfchess-stockfish" }
bevy = { version = "=0.20.0", default-features = false, features = ["default", "webgl2", "mp3", "bevy_gltf", "jpeg", "hdr", "android-game-activity"] }
bevy_sprite = "=0.20.0"
bevy_text = "=0.20.0"
bevy_ui = "=0.20.0"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
winit = "=0.30.13"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = "=0.20.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
bincode = "=1.3.3"
json = { package = "sonic-rs", version = "=0.3" }
futures = "=0.3"
parking_lot = "=0.12"
url = { version = "=2.5", features = ["serde"] }
base64 = "=0.23.1"
zstd = "=0.13"
rand = "=0.10"
regex = "=1.13.1"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
futures-lite = "=2.6.1"
async-trait = "=0.1.92"
uuid = { version = "=1.21.0", features = ["v4", "fast-rng"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
tracing-appender = "=0.2.3"
reqwest = { version = "=0.13.4", features = ["json", "blocking"] }
bs58 = "=0.5.1"
crossbeam-channel = "=0.5.17"
web-time = "=1.1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "allow" }
